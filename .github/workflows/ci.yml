name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      OUTREACH_AUTO_POLL: "0"
      OUTREACH_AUTO_SCAN: "0"
      OUTREACH_AUTO_RECHECK: "0"
      OUTREACH_AUTO_RESEARCH: "0"
      OUTREACH_AUTOSEND_SCHEDULER: "0"
      OUTREACH_EMBEDDED_WORKER: "0"
      OUTREACH_AGENT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest.log
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: backend/pytest.log
          if-no-files-found: ignore

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependency tree
        run: npm run audit:production
      - name: Audit complete dependency tree
        run: npm run audit:all
      - name: Build
        run: npm run build
